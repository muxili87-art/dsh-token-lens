name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Bundle contract (dsh.client / exports / patch name)
        run: npm run doctor
